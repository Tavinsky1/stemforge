[project]
name = "stemforge"
version = "0.1.0"
description = "Transcribe a song's stems into MIDI and rebuild it in Ableton Live 12 (Session or Arrangement)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "librosa>=0.10", "mido"]

[project.optional-dependencies]
pitched = ["basic-pitch"]   # polyphonic transcription; see README for the Apple Silicon backend
dev = ["pytest"]

[project.scripts]
stemforge = "stemforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stemforge"]
