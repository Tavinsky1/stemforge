[project]
name = "stemforge"
version = "0.1.0"
description = "Transcribe a song's stems into MIDI and rebuild it in Ableton Live 12 (Session or Arrangement)"
requires-python = ">=3.10,<3.13"   # basic-pitch pins old numpy: no wheels on 3.13/3.14
dependencies = ["numpy", "scipy", "soundfile", "librosa>=0.10", "mido"]

[project.optional-dependencies]
pitched = ["basic-pitch", "setuptools<81"]   # polyphonic transcription; resampy needs pkg_resources. Use Python 3.11.
app = ["PySide6>=6.6"]
package = ["pyinstaller"]   # packaging/build_app.sh -> Stemforge.app
dev = ["pytest"]

[project.scripts]
stemforge = "stemforge.cli:main"
stemforge-app = "stemforge.app.window:main"   # native desktop window

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stemforge"]
